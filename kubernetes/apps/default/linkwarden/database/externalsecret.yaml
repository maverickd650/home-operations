---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: linkwarden-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: linkwarden
        password: "{{ .LINKWARDEN_POSTGRES_OWNER_PASSWORD }}"
        uri: "postgres://linkwarden:{{ .LINKWARDEN_POSTGRES_OWNER_PASSWORD }}@linkwarden-postgres-rw:5432/linkwarden?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: linkwarden
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: linkwarden-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .LINKWARDEN_POSTGRES_APP_PASSWORD }}"
        uri: "postgres://linkwarden_app:{{ .LINKWARDEN_POSTGRES_APP_PASSWORD }}@linkwarrden-postgres-rw:5432/linkwarden?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: linkwarden
