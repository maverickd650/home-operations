---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: linkwarden-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: linkwarden
        password: "{{ .LINKWARDEN_POSTGRES_PASSWORD }}"
        uri: "postgres://linkwarden:{{ .LINKWARDEN_POSTGRES_PASSWORD }}@linkwarden-postgres-rw:5432/linkwarden?sslmode=require&connect_timeout=10"
  data:
    - secretKey: LINKWARDEN_POSTGRES_PASSWORD
      remoteRef:
        key: LINKWARDEN_POSTGRES_PASSWORD
