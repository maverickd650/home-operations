---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: linkwarden-app
spec:
  cluster:
    name: linkwarden-postgres
  name: linkwarden_app
  ensure: present
  login: true
  inherit: true
  passwordSecret:
    name: linkwarden-postgres-app
  databaseRoleReclaimPolicy: retain
