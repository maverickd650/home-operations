---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mavbot-pem
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mavbot-pem
  data:
    - secretKey: private_key_pem
      remoteRef:
        key: MAVBOT_PEM
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: labs-bot-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: labs-bot-secret
  data:
    - secretKey: labbot-app-id
      remoteRef:
        key: renovate/GITHUB_LAB_ID
    - secretKey: labbot-app-install
      remoteRef:
        key: renovate/GITHUB_LAB_INSTALL
    - secretKey: labbot-app-pem
      remoteRef:
        key: renovate/GITHUB_LAB_PEM
