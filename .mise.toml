[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
python = "3.14.7"
uv = "0.12.8"
pipx = "1.17.1"
talhelper = "3.1.17"
cilium-cli = "0.20.0"
cloudflared = "2026.8.3"
age = "1.3.2"
flux2 = "2.9.5"
gh = "2.98.0"
gum = "2.0.0"
sd = "1.1.0"
sops = "3.13.3"
task = "3.53.1"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.2"
kustomize = "5.8.1"
lefthook = "2.1.12"
kubectl = "1.37.0"
yq = "4.53.6"
talosctl = "1.13.9"
kubeconform = "0.8.0"
zizmor = "1.30.0"

[hooks]
postinstall = "lefthook install"
