[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
python = "3.14.8"
uv = "0.12.21"
pipx = "1.17.9"
talhelper = "3.1.17"
cilium-cli = "0.20.1"
cloudflared = "2026.9.3"
age = "1.3.2"
flux2 = "2.9.6"
gh = "2.102.0"
gum = "2.0.2"
sd = "1.1.0"
sops = "3.13.3"
task = "3.54.0"
helm = "4.3.0"
helmfile = "1.8.1"
jq = "1.8.2"
kustomize = "5.8.2"
lefthook = "2.1.16"
kubectl = "1.37.1"
yq = "4.54.1"
talosctl = "1.13.9"
kubeconform = "0.8.0"
zizmor = "1.30.1"

[hooks]
postinstall = "lefthook install"
